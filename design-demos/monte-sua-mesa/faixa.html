<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monte sua mesa — faixa</title>
  <style>
    :root {
      --ink: #404041;
      --muted: #595959;
      --ivory: #f2f2f3;
      --cloth: #fbfbfb;
      --line: #e3e3e3;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--ivory);
      font-size: 16px;
      line-height: 1.45;
    }
    main { width: min(1120px, calc(100% - 48px)); margin: 0 auto; padding-bottom: 48px; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      padding-top: 28px;
    }
    h1 { font-size: 40px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; margin: 0; }
    .lede { max-width: 36ch; margin: 0; color: var(--muted); }
    .table {
      position: relative;
      margin-top: 22px;
      height: 280px;
      border-radius: 18px;
      background: var(--cloth);
      box-shadow: 0 18px 32px -20px rgb(64 64 65 / 0.45), inset 0 0 0 1px rgb(64 64 65 / 0.08);
    }
    .piece { position: absolute; translate: -50% -50%; }
    .board { border-radius: 6px; background: #cbbfa8; box-shadow: 0 12px 16px -10px rgb(64 64 65 / 0.4); }
    .loaf { border-radius: 8px; background: #e4dfd6; box-shadow: 0 12px 16px -10px rgb(64 64 65 / 0.4); }
    .platter { border-radius: 10px; background: #f7f7f7; box-shadow: inset 0 0 0 1px #e3e3e3, 0 10px 14px -10px rgb(64 64 65 / 0.4); }
    .round { border-radius: 50%; background: #f3e2b8; box-shadow: 0 10px 14px -10px rgb(64 64 65 / 0.4); }
    h2 { font-size: 26px; font-weight: 500; margin: 28px 0 12px; }
    .kits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .kit {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 168px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #e7e7e8;
      color: var(--ink);
      text-align: left;
      font: inherit;
    }
    .kit strong { font-size: 18px; font-weight: 600; }
    .kit span { color: var(--muted); font-size: 15px; }
    .bits { display: flex; align-items: flex-end; gap: 6px; margin-top: auto; }
    .bit { display: block; }
    .menu { display: flex; gap: 18px; overflow: hidden; }
    .menu article { width: 180px; flex: none; }
    .menu .photo { height: 120px; border-radius: 8px; background: #ddd8cf; }
    .menu p { margin: 8px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <h1>Monte sua mesa</h1>
      <p class="lede">A mesa ocupa a largura da página. Os kits ficam numa faixa, cada um com a miniatura do que entra.</p>
    </div>
    <div class="table" aria-label="Mesa montada">
      <div class="piece board" style="left:22%;top:50%;width:24%;height:42%"></div>
      <div class="piece loaf" style="left:46%;top:42%;width:16%;height:34%"></div>
      <div class="piece platter" style="left:66%;top:58%;width:18%;height:22%"></div>
      <div class="piece round" style="left:84%;top:46%;width:9%;height:28%"></div>
    </div>
    <h2>Sugestões prontas</h2>
    <div class="kits">
      <button class="kit" type="button">
        <strong>Mesa para dois</strong>
        <span>2 a 3 pessoas</span>
        <span class="bits" aria-hidden="true">
          <i class="bit round" style="width:26px;height:26px;border-radius:50%;background:#f3e2b8"></i>
          <i class="bit" style="width:42px;height:14px;border-radius:4px;background:#f7f7f7"></i>
          <i class="bit" style="width:36px;height:14px;border-radius:4px;background:#e4dfd6"></i>
        </span>
      </button>
      <button class="kit" type="button">
        <strong>Encontro</strong>
        <span>Até 5 pessoas</span>
        <span class="bits" aria-hidden="true">
          <i class="bit" style="width:40px;height:14px;border-radius:4px;background:#f7f7f7"></i>
          <i class="bit round" style="width:24px;height:24px;border-radius:50%;background:#f4f4f4"></i>
          <i class="bit" style="width:34px;height:14px;border-radius:4px;background:#e4dfd6"></i>
        </span>
      </button>
      <button class="kit" type="button">
        <strong>Queijos e frios</strong>
        <span>Cerca de 6 pessoas</span>
        <span class="bits" aria-hidden="true">
          <i class="bit" style="width:48px;height:16px;border-radius:3px;background:#cbbfa8"></i>
          <i class="bit round" style="width:26px;height:26px;border-radius:50%;background:#f3e2b8"></i>
        </span>
      </button>
      <button class="kit" type="button">
        <strong>Mesa de festa</strong>
        <span>Cerca de 12 pessoas</span>
        <span class="bits" aria-hidden="true">
          <i class="bit" style="width:52px;height:16px;border-radius:3px;background:#cbbfa8"></i>
          <i class="bit" style="width:36px;height:14px;border-radius:4px;background:#e4dfd6"></i>
          <i class="bit round" style="width:22px;height:22px;border-radius:50%;background:#f3e2b8"></i>
        </span>
      </button>
    </div>
    <h2>Tortas frias</h2>
    <div class="menu">
      <article>
        <div class="photo"></div>
        <p>Torta Fria Frango</p>
        <p>R$ 110,00</p>
      </article>
      <article>
        <div class="photo" style="background:#efe8dc"></div>
        <p>Torta Fria Frango Pequena</p>
        <p>R$ 64,00</p>
      </article>
      <article>
        <div class="photo" style="background:#e5ddd2"></div>
        <p>Torta Fria Vegetariana</p>
        <p>R$ 110,00</p>
      </article>
      <article>
        <div class="photo"></div>
        <p>Torta Fria Vegetariana Pequena</p>
        <p>R$ 64,00</p>
      </article>
    </div>
  </main>
</body>
</html>
